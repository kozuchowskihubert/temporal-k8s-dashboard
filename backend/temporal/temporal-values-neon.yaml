# Temporal Helm Values - Production Configuration with NEON PostgreSQL
# Chart version: 0.73.1
# Database: NEON PostgreSQL with connection pooling

# Global settings
global:
  # Image pull policy
  image:
    pullPolicy: IfNotPresent

# Server configuration
server:
  # Enable server components
  enabled: true
  
  # Image configuration
  image:
    repository: temporalio/server
    tag: 1.24.2
    pullPolicy: IfNotPresent
  
  # Replicas for high availability
  replicaCount: 3
  
  # Resources
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: 2000m
      memory: 4Gi
  
  # Anti-affinity to spread pods across nodes
  affinity:
    podAntiAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          podAffinityTerm:
            labelSelector:
              matchLabels:
                app.kubernetes.io/name: temporal
                app.kubernetes.io/component: server
            topologyKey: kubernetes.io/hostname
  
  # Temporal server configuration
  config:
    persistence:
      defaultStore: default
      visibilityStore: visibility
      numHistoryShards: 512
      datastores:
        default:
          sql:
            pluginName: postgres
            driverName: postgres
            databaseName: neondb
            connectAddr: ep-wispy-paper-aaghbbh9-pooler.westus3.azure.neon.tech:5432
            connectProtocol: tcp
            host: ep-wispy-paper-aaghbbh9-pooler.westus3.azure.neon.tech
            port: 5432
            user: neondb_owner
            existingSecret: temporal-db-secret
            secretKey: password
            maxConns: 20
            maxIdleConns: 20
            maxConnLifetime: 1h
            tls:
              enabled: true
              enableHostVerification: false
        visibility:
          sql:
            pluginName: postgres
            driverName: postgres
            databaseName: neondb
            connectAddr: ep-wispy-paper-aaghbbh9-pooler.westus3.azure.neon.tech:5432
            connectProtocol: tcp
            host: ep-wispy-paper-aaghbbh9-pooler.westus3.azure.neon.tech
            port: 5432
            user: neondb_owner
            existingSecret: temporal-db-secret
            secretKey: password
            maxConns: 20
            maxIdleConns: 20
            maxConnLifetime: 1h
            tls:
              enabled: true
              enableHostVerification: false

# Frontend service configuration
frontend:
  enabled: true
  replicaCount: 3
  
  service:
    type: ClusterIP
    port: 7233
  
  resources:
    requests:
      cpu: 300m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 2Gi

# History service configuration
history:
  enabled: true
  replicaCount: 3
  
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: 2000m
      memory: 4Gi

# Matching service configuration
matching:
  enabled: true
  replicaCount: 3
  
  resources:
    requests:
      cpu: 300m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 2Gi

# Worker service configuration
worker:
  enabled: true
  replicaCount: 2
  
  resources:
    requests:
      cpu: 300m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 2Gi

# Web UI configuration
web:
  enabled: true
  replicaCount: 2
  
  service:
    type: ClusterIP
    port: 8080
  
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  
  ingress:
    enabled: false
    # Configure ingress if you want external access
    # annotations: {}
    # hosts:
    #   - host: temporal-ui.example.com
    #     paths:
    #       - path: /
    # tls: []

# Admin tools (CLI) - useful for debugging
admintools:
  enabled: true
  
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

# Prometheus metrics
prometheus:
  enabled: true
  
  serviceMonitor:
    enabled: false
    # Set to true if you have Prometheus Operator installed

# Grafana dashboards
grafana:
  enabled: true
  # Deploy Grafana with pre-configured Temporal dashboards
  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard
  image:
    tag: 10.3.3

# Elasticsearch for advanced visibility (optional)
# elasticsearch:
#   enabled: false
#   # For production, consider using Elasticsearch for better search capabilities

# Cassandra (not used - we're using PostgreSQL)
cassandra:
  enabled: false

# Schema setup job
schema:
  # Run schema setup job to initialize database tables
  setup:
    enabled: true
    backoffLimit: 10
  
  # Schema update job (for upgrades)
  update:
    enabled: true
