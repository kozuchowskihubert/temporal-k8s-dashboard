server:
  enabled: true
  
  # Image configuration
  image:
    repository: temporalio/server
    tag: 1.24.2
    pullPolicy: IfNotPresent
  
  # Replicas for high availability
  replicaCount: 3
  
  # Resources
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: 2000m
      memory: 4Gi
  
  # Anti-affinity to spread pods across nodes
  affinity:
    podAntiAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          podAffinityTerm:
            labelSelector:
              matchLabels:
                app.kubernetes.io/name: temporal
                app.kubernetes.io/component: server
            topologyKey: kubernetes.io/hostname
  
  # Temporal server configuration
  config:
    persistence:
      defaultStore: default
      visibilityStore: visibility
      numHistoryShards: 512
      default:
        driver: "sql"
        sql:
          driver: "postgres12"
          databaseName: neondb
          connectAddr: ep-wispy-paper-aaghbbh9.westus3.azure.neon.tech:5432
          connectProtocol: tcp
          host: ep-wispy-paper-aaghbbh9.westus3.azure.neon.tech
          port: 5432
          user: neondb_owner
          existingSecret: temporal-db-secret
          secretKey: password
          maxConns: 20
          maxIdleConns: 20
          maxConnLifetime: 1h
          tls:
            enabled: true
            enableHostVerification: false
      visibility:
        driver: "sql"
        sql:
          driver: "postgres12"
          databaseName: neondb
          connectAddr: ep-wispy-paper-aaghbbh9.westus3.azure.neon.tech:5432
          connectProtocol: tcp
          host: ep-wispy-paper-aaghbbh9.westus3.azure.neon.tech
          port: 5432
          user: neondb_owner
          existingSecret: temporal-db-secret
          secretKey: password
          maxConns: 20
          maxIdleConns: 20
          maxConnLifetime: 1h
          tls:
            enabled: true
            enableHostVerification: false

# Frontend service configuration
frontend:
  enabled: true
  replicaCount: 3
  
  service:
    type: ClusterIP
    port: 7233
  
  resources:
    requests:
      cpu: 300m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 2Gi

# History service configuration
history:
  enabled: true
  replicaCount: 3
  
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: 2000m
      memory: 4Gi

# Matching service configuration
matching:
  enabled: true
  replicaCount: 3
  
  resources:
    requests:
      cpu: 300m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 2Gi

# Worker service configuration
worker:
  enabled: true
  replicaCount: 2
  
  resources:
    requests:
      cpu: 300m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 2Gi

# Web UI configuration
web:
  enabled: true
  replicaCount: 2
  
  service:
    type: ClusterIP
    port: 8080
  
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  
  ingress:
    enabled: false
    # Configure ingress if you want external access
    # annotations: {}
    # hosts:
    #   - host: temporal-ui.example.com
    #     paths:
    #       - path: /
    # tls: []

# Admin tools (CLI) - useful for debugging
admintools:
  enabled: true
  
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

# Monitoring
prometheus:
  enabled: true
  serviceMonitor:
    enabled: false

grafana:
  enabled: true
  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard
    datasources:
      enabled: true
      defaultDatasourceEnabled: true
  image:
    tag: 10.3.3

# Disable unused dependencies
elasticsearch:
  enabled: false
cassandra:
  enabled: false

# Database Schema Management
schema:
  setup:
    enabled: true
    backoffLimit: 10
  update:
    enabled: true
